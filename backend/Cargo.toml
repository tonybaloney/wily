[package]
name = "wily_backend"
version = "2.0.0-alpha.1"
edition = "2021"

[lib]
name = "wily_backend"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module", "auto-initialize"] }
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", package = "ruff_python_parser", branch = "main" }
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", package = "ruff_python_ast", branch = "main" }
ruff_python_trivia = { git = "https://github.com/astral-sh/ruff", package = "ruff_python_trivia", branch = "main" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff", package = "ruff_text_size", branch = "main" }
ruff_source_file = { git = "https://github.com/astral-sh/ruff", package = "ruff_source_file", branch = "main" }
walkdir = "2"
glob = "0.3"
regex = "1"
rayon = "1.10"
compact_str = "0.9"
git2 = { version = "0.20.4", features = ["vendored-openssl"] }
arrow = { version = "54", default-features = false }
parquet = { version = "54", default-features = false, features = ["arrow", "lz4", "zstd"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "analyze_revision"
harness = false
